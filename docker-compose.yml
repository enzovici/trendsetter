services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: trendsetter
      POSTGRES_PASSWORD: trendsetter
      POSTGRES_DB: trendsetter
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendsetter -d trendsetter"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: app tables (alembic) + procrastinate queue schema.
  # `schema --apply` is not idempotent, hence the || true guard; the worker
  # fails loudly at startup if the schema is genuinely missing.
  migrate:
    build: .
    command: >
      sh -c "alembic upgrade head
      && (procrastinate --app=trendsetter.worker.tasks.app schema --apply || true)"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trendsetter:trendsetter@db:5432/trendsetter
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    command: uvicorn trendsetter.web.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trendsetter:trendsetter@db:5432/trendsetter
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: procrastinate --app=trendsetter.worker.tasks.app worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trendsetter:trendsetter@db:5432/trendsetter
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  dbdata:
